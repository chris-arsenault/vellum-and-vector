[package]
name = "atlas-host"
version.workspace = true
edition.workspace = true
publish.workspace = true

[features]
integration-tests = ["dep:testcontainers"]

[lib]
crate-type = ["rlib"]

[[bin]]
name = "atlas_browser"

[[bin]]
name = "atlas_server"

[dependencies]
serde.workspace = true
atlas-map.workspace = true
atlas-gis.workspace = true
atlas-generation.workspace = true
atlas-names.workspace = true
serde_json.workspace = true
ts-rs.workspace = true
ciborium = "0.2"
uuid = { version = "1", features = ["v4"] }
percent-encoding = "2"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen.workspace = true
wasm-bindgen-futures = "0.4"
js-sys = "0.3"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
postgres = { version = "0.19", features = ["with-serde_json-1"] }
tiny_http = { version = "0.12", features = ["ssl-rustls"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
futures = { version = "0.3", default-features = false, features = ["executor", "std"] }
testcontainers = { version = "0.28", features = ["blocking"], optional = true }

[lints]
workspace = true

[build-dependencies]
cc = "1"

[dev-dependencies]
wasm-bindgen-test.workspace = true
tiff = { version = "0.11", default-features = false, features = ["deflate"] }
