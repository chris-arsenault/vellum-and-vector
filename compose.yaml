services:
  atlas:
    image: ghcr.io/chris-arsenault/vellum-and-vector:${IMAGE_TAG:-latest}
    network_mode: host
    restart: unless-stopped
    environment:
      # The executable rejects wildcard and public bind addresses.
      ATLAS_BIND: "${ATLAS_LAN_IP:-192.168.66.3}:${ATLAS_PORT:-4123}"
      ATLAS_MAP_DATABASE_URL: "${ATLAS_MAP_DATABASE_URL:?Set the map writer connection}"
      ATLAS_MAP_READER_URL: "${ATLAS_MAP_READER_URL:?Set the map reader connection}"
      ATLAS_GENERATION_DATABASE_URL: "${ATLAS_GENERATION_DATABASE_URL:?Set the generation writer connection}"
      ATLAS_MAP_ASSETS: /data/maps
      ATLAS_GENERATION_RESOURCES: /data/generation
      ATLAS_GENERATION_SCRATCH: /scratch
      ATLAS_FRONTEND: /opt/atlas/frontend
      ATLAS_TLS_CERTIFICATE: /certificates/certificate.pem
      ATLAS_TLS_PRIVATE_KEY: /certificates/private-key.pem
    volumes:
      - atlas-data:/data
      - atlas-scratch:/scratch
      - "${ATLAS_TLS_CERTIFICATE:?Set the existing LAN certificate path}:/certificates/certificate.pem:ro"
      - "${ATLAS_TLS_PRIVATE_KEY:?Set the existing LAN private key path}:/certificates/private-key.pem:ro"
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent --insecure https://$$ATLAS_BIND/health"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  atlas-data:
  atlas-scratch:
