[target.wasm32-unknown-emscripten]
linker = "em++"
runner = "wasm-bindgen-test-runner"
rustflags = [
  "-Cpanic=abort",
  "-Crelocation-model=static",
  "-Ctarget-feature=+atomics,+bulk-memory",
  "-Clink-arg=-pthread",
  "-Clink-arg=-sPTHREAD_POOL_SIZE=1",
  "-Clink-arg=-sWASMFS",
  "-Clink-arg=-sWASM_BINDGEN",
  "-Clink-arg=-sMODULARIZE",
  "-Clink-arg=-sEXPORT_ES6",
  "-Clink-arg=-sALLOW_MEMORY_GROWTH",
  "-Clink-arg=-sMAXIMUM_MEMORY=4GB",
  "-Clink-arg=-sSTACK_SIZE=2097152",
  "-Clink-arg=-sSTACK_OVERFLOW_CHECK=2",
]

[env]
CC_wasm32_unknown_emscripten = "emcc"
CXX_wasm32_unknown_emscripten = "em++"
AR_wasm32_unknown_emscripten = "emar"
CFLAGS_wasm32_unknown_emscripten = "-pthread"
CXXFLAGS_wasm32_unknown_emscripten = "-pthread -fwasm-exceptions"
